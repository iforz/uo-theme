# Inside this blog's HTTPS server, before the generic enable-php include.
location ~ ^/index\.php(?:/|$) {
    try_files /index.php =404;
    fastcgi_pass unix:/tmp/php-cgi-85.sock;
    fastcgi_index index.php;
    include fastcgi.conf;
    include pathinfo.conf;
    fastcgi_cache uo_blog_html;
    fastcgi_cache_key "$scheme|$host|GET|$request_uri";
    fastcgi_cache_methods GET HEAD;
    fastcgi_cache_valid 200 30s;
    fastcgi_cache_bypass $uo_blog_skip_html;
    fastcgi_no_cache $uo_blog_skip_html $upstream_http_set_cookie;
    fastcgi_cache_lock on;
    fastcgi_cache_lock_timeout 1s;
    # Preserve native Cache-Control, Set-Cookie and Vary rules; no ignore_headers.
    add_header X-UO-HTML-Cache $upstream_cache_status always;
    # Browser HTML must revalidate; this does not prevent the server's short cache.
    add_header Cache-Control "no-cache" always;
}
location ~* ^/wp-content/themes/uo-theme/assets/.+\.(?:css|js|webp|gif)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
}
