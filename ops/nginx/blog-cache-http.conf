# http context, included only once by blog.iforz.cn.conf.
# A separate zone and directory isolate this blog from sibling sites.
fastcgi_cache_path /www/server/nginx/cache/uo-blog-html levels=1:2 keys_zone=uo_blog_html:4m inactive=2m max_size=32m use_temp_path=off;
map $request_uri $uo_blog_public_html {
    default 0;
    / 1;
    "~^/index\\.php/[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]/[^/?]+/?$" 1;
}
# Fail closed: any Cookie, query, Authorization, non-read method or unlisted route bypasses.
map "$request_method|$query_string|$http_cookie|$http_authorization|$uo_blog_public_html" $uo_blog_skip_html {
    default 1;
    "GET||||1" 0;
    "HEAD||||1" 0;
}
