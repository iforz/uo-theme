name: Theme checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate theme source
        run: php scripts/check.php
      - name: Verify update security and failure paths
        run: |
          php tests/updates.php
          php tests/settings.php
          php tests/reading.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify core scripts
        run: node tests/core.mjs
